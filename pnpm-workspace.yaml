shellEmulator: true

trustPolicy: no-downgrade

# known false positives: older releases had provenance, these maintenance releases don't
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
